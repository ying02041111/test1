<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>緋夜飼育錄</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 全域防閃退與錯誤攔截器
        window.onerror = function(msg, url, line, col, error) {
            console.error("遊戲運行錯誤: ", msg, " 行數: ", line);
            var errBox = document.getElementById("error-banner");
            if (errBox) {
                errBox.style.display = "block";
                errBox.innerText = "系統提示：捕捉到運行異常，請嘗試重新整理。(" + msg + ")";
            }
            return false;
        };
    </script>
</head>
<body>
    <div id="error-banner" class="error-banner" style="display: none;"></div>

    <div class="app-container">
        <!-- 頂部主控狀態列 -->
        <header class="master-header">
            <div class="header-row">
                <span class="header-title">緋夜飼育錄</span>
                <span id="display-time" class="time-badge">第 1 日 · 清晨</span>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">階級:</span>
                    <span id="master-rank" class="stat-val highlight">見習飼育員</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">體力:</span>
                    <span id="master-hp" class="stat-val">100/100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">金幣:</span>
                    <span id="master-gold" class="stat-val gold-val">800 G</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">經驗:</span>
                    <span id="master-exp" class="stat-val">0 EXP</span>
                </div>
            </div>
        </header>

        <!-- 分頁切換選單 -->
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-story')">劇情對話</button>
            <button class="tab-btn" onclick="switchTab('tab-succubi')">魅魔狀態</button>
            <button class="tab-btn" onclick="switchTab('tab-items')">隨身背包</button>
            <button class="tab-btn" onclick="switchTab('tab-housing')">領地房產</button>
        </nav>

        <!-- 主體內容區 -->
        <main class="content-body">
            <!-- 1. 劇情對話分頁 -->
            <section id="tab-story" class="tab-content active">
                <div id="story-log" class="story-scroll">
                    <!-- 劇情對話動態插入 -->
                </div>
                <div class="input-container">
                    <textarea id="player-input" placeholder="輸入你的行動、言語或指令..." rows="2"></textarea>
                    <button id="btn-send" class="btn-primary" onclick="handleSendAction()">行動</button>
                </div>
            </section>

            <!-- 2. 魅魔狀態分頁 -->
            <section id="tab-succubi" class="tab-content">
                <div id="succubi-container" class="card-list">
                    <!-- 魅魔卡片動態渲染 -->
                </div>
            </section>

            <!-- 3. 背包道具分頁 -->
            <section id="tab-items" class="tab-content">
                <div id="inventory-container" class="card-list">
                    <!-- 道具卡片動態渲染 -->
                </div>
            </section>

            <!-- 4. 房產分頁 (三層折疊) -->
            <section id="tab-housing" class="tab-content">
                <div id="housing-container" class="district-list">
                    <!-- 街區房屋動態渲染 -->
                </div>
            </section>
        </main>
    </div>

    <!-- 核心腳本載入順序 -->
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="ai.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
