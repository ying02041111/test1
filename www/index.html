<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2b0808">
<title>緋夜飼育錄</title>
<link rel="stylesheet" href="style.css">
<script>
window.addEventListener('error', function(e) {
  var b = document.getElementById('boot');
  if (b) {
    b.classList.remove('off');
    b.innerHTML = '<div style="padding:20px;color:#ffffd3;font-size:14px;word-break:break-all;">'
      + '<h3 style="color:#f4806d">⚠️ 載入發生錯誤</h3><p>' + (e.message || '未知錯誤') + '</p>'
      + '<p style="color:#f3f2b4;font-size:12px;">' + (e.filename || '') + ' Line:' + (e.lineno || 0) + '</p></div>';
  }
});
</script>
</head>
<body>
<div id="topbar">
  <div class="tb-l"><b id="tb-title">緋夜飼育錄</b><span id="tb-when">第1天 · 清晨 (1/3)</span></div>
  <div class="tb-r">
    <span class="chip m" id="tb-money">₡0</span>
  </div>
</div>

<main id="pages">
  <!-- 主頁：純故事與選項 -->
  <section class="page on" id="page-home">
    <div id="home-story" class="story"></div>
    <div id="home-choices" class="choices"></div>
    <div class="freebox">
      <input id="free-input" placeholder="自由描述你的行動、對話或態度…">
      <button id="free-send" class="btn ghost">送出</button>
    </div>
    <div class="toolrow">
      <button id="btn-compress" class="btn tiny">🗜 壓縮劇情</button>
      <span id="token-hint" class="tiny-note"></span>
    </div>
  </section>

  <!-- 魅魔資料分頁 -->
  <section class="page" id="page-succubi">
    <div id="succubi-list" class="cards"></div>
  </section>

  <!-- 主控屬性與背包分頁 -->
  <section class="page" id="page-master">
    <div id="master-body"></div>
  </section>

  <!-- 房產分頁（下拉選單） -->
  <section class="page" id="page-house">
    <div id="house-now"></div>
    <h3 class="sec">各街區房產（點擊展開）</h3>
    <div id="house-accordion"></div>
  </section>

  <!-- 設定分頁 -->
  <section class="page" id="page-settings">
    <div id="set-body"></div>
  </section>
</main>

<nav id="tabbar">
  <button data-tab="home" class="on">劇情</button>
  <button data-tab="succubi">魅魔</button>
  <button data-tab="master">主控</button>
  <button data-tab="house">房產</button>
  <button data-tab="settings">設定</button>
</nav>

<div id="modal" class="hidden"><div id="modal-box"></div></div>
<div id="toast"></div>
<div id="boot"><div style="color:#f3f2b4;margin-top:40vh;text-align:center;">蘋果誘惑構建中…</div></div>

<script src="data.js"></script>
<script src="core.js"></script>
<script src="ai.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
