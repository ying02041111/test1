<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>緋夜飼育錄</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="status-bar">
      <div class="brand">緋夜飼育錄</div>
      <div class="status-meta">
        <span id="stat-day">第 1 日 · 早晨</span>
        <span id="stat-gold" class="pill">1000 金</span>
        <span id="stat-rank" class="rank-badge">見習飼育員</span>
      </div>
    </header>

    <main id="view">
      <section id="panel-story" class="panel active">
        <div id="story-log" class="story-log"></div>
        <div id="choice-list" class="choice-list"></div>
        <div class="story-input">
          <input id="story-input-field" type="text" placeholder="你想對他說些什麼、做些什麼……" autocomplete="off">
          <button id="btn-compress" class="btn btn-mini" title="把前情壓縮成摘要，節省 token">壓縮</button>
          <button id="btn-send" class="btn btn-accent">送出</button>
        </div>
      </section>

      <section id="panel-succubi" class="panel">
        <div class="panel-head">
          <h2>魅魔</h2>
          <button id="btn-open-help" class="btn">屬性說明</button>
          <button id="btn-open-market" class="btn">緋夜市場</button>
        </div>
        <div id="succubi-list" class="succubi-list"></div>
      </section>

      <section id="panel-master" class="panel">
        <div class="card">
          <h2 class="card-title">主控</h2>
          <div class="rank-block">
            <div id="master-rank-name" class="rank-name">見習飼育員</div>
            <div class="bar-track"><div id="master-exp-bar" class="bar-fill"></div></div>
            <div id="master-exp-text" class="bar-text">0 / 100</div>
          </div>
          <div class="stat-row">
            <span>體力 <b id="master-hp">100</b> / <b>100</b></span>
            <span>金錢 <b id="master-gold">1000</b></span>
          </div>
          <div class="field">
            <label for="master-diet">飲食偏好（影響每日吃食花費與過夜回體）</label>
            <select id="master-diet"></select>
          </div>
          <div class="field">
            <label for="master-style">訓練風格</label>
            <select id="master-style"></select>
          </div>
          <div class="field">
            <label for="master-persona">自訂人設（會注入 AI）</label>
            <textarea id="master-persona" rows="3" placeholder="寫下你希望扮演的主人樣貌……"></textarea>
          </div>
          <button id="btn-open-api" class="btn">API 設定</button>
          <div class="house-actions" style="justify-content:flex-start">
            <button id="btn-export-save" class="btn">匯出存檔</button>
            <button id="btn-import-save" class="btn">匯入存檔</button>
          </div>
          <button id="btn-reset" class="btn btn-danger">重新開始</button>
        </div>
      </section>

      <section id="panel-inventory" class="panel">
        <div class="panel-head">
          <h2>背包</h2>
          <button id="btn-open-shop" class="btn">道具商店</button>
          <button id="btn-open-collar" class="btn">項圈商店</button>
        </div>
        <div id="inventory-list" class="inventory-list"></div>
      </section>

      <section id="panel-property" class="panel">
        <div class="panel-head"><h2>房產</h2></div>
        <div id="property-list" class="property-list"></div>
      </section>
    </main>

    <nav id="bottom-nav">
      <button class="nav-btn active" data-tab="story">劇情</button>
      <button class="nav-btn" data-tab="succubi">魅魔</button>
      <button class="nav-btn" data-tab="master">主控</button>
      <button class="nav-btn" data-tab="inventory">背包</button>
      <button class="nav-btn" data-tab="property">房產</button>
    </nav>
  </div>

  <!-- 今日模式視窗 -->
  <div id="modal-daymode" class="modal-overlay">
    <div class="modal-dialog modal-dialog-sm">
      <div class="modal-head"><h2>今日安排</h2></div>
      <div id="daymode-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 出門隊伍視窗 -->
  <div id="modal-party" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2>帶誰出門</h2>
        <button class="modal-close" data-close="modal-party">×</button>
      </div>
      <div id="party-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 市場視窗 -->
  <div id="modal-market" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="market-title">緋夜市場</h2>
        <button class="modal-close" data-close="modal-market">×</button>
      </div>
      <div id="market-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 道具商店視窗 -->
  <div id="modal-shop" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="shop-title">道具商店</h2>
        <button class="modal-close" data-close="modal-shop">×</button>
      </div>
      <div id="shop-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 項圈商店視窗 -->
  <div id="modal-collar" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="collar-title">項圈商店</h2>
        <button class="modal-close" data-close="modal-collar">×</button>
      </div>
      <div id="collar-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 屬性說明視窗 -->
  <div id="modal-help" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2>屬性說明</h2>
        <button class="modal-close" data-close="modal-help">×</button>
      </div>
      <div id="help-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 魅魔詳情視窗 -->
  <div id="modal-succubus" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="succubus-title">魅魔詳情</h2>
        <button class="modal-close" data-close="modal-succubus">×</button>
      </div>
      <div id="succubus-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 契約確認彈窗 -->
  <div id="modal-confirm" class="modal-overlay">
    <div class="modal-dialog modal-dialog-sm">
      <div class="modal-head">
        <h2 id="confirm-title">契約確認</h2>
        <button class="modal-close" data-close="modal-confirm">×</button>
      </div>
      <div id="confirm-body" class="modal-body"></div>
      <div id="confirm-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- 出售／拍賣視窗 -->
  <div id="modal-sell" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="sell-title">契約轉讓</h2>
        <button class="modal-close" data-close="modal-sell">×</button>
      </div>
      <div id="sell-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 永久契約視窗 -->
  <div id="modal-contract" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2>永久契約</h2>
        <button class="modal-close" data-close="modal-contract">×</button>
      </div>
      <div id="contract-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 存檔碼視窗 -->
  <div id="modal-savecode" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="savecode-title">存檔</h2>
        <button class="modal-close" data-close="modal-savecode">×</button>
      </div>
      <div class="modal-body">
        <p id="savecode-hint" style="font-size:12.5px;color:var(--ink-soft)"></p>
        <textarea id="savecode-text" rows="6" style="font-size:11px;font-family:monospace"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('modal-savecode')">關閉</button>
        <button id="savecode-action" class="btn btn-accent">確定</button>
      </div>
    </div>
  </div>

  <!-- API 設定彈窗 -->
  <div id="modal-api" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2>API 設定</h2>
        <button class="modal-close" data-close="modal-api">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="api-key">API Key</label>
          <input id="api-key" type="password" placeholder="sk-...">
        </div>
        <div class="field">
          <label for="api-url">API URL（Base URL 或完整位址皆可）</label>
          <input id="api-url" type="text" placeholder="https://api.deepseek.com">
        </div>
        <div class="field">
          <label for="api-model">模型</label>
          <input id="api-model" type="text" placeholder="deepseek-chat">
        </div>
        <div class="field-row">
          <label for="api-thinking">深度思考</label>
          <label class="switch">
            <input id="api-thinking" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        <div class="field-row">
          <label for="api-showtokens">顯示 token 用量</label>
          <label class="switch">
            <input id="api-showtokens" type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
        <div class="field">
          <label>溫度 <span id="temp-val" class="range-val">0.9</span></label>
          <input id="api-temperature" type="range" min="0" max="2" step="0.1" value="0.9">
        </div>
        <div class="field">
          <label>Top P <span id="topp-val" class="range-val">1.0</span></label>
          <input id="api-topp" type="range" min="0" max="1" step="0.05" value="1">
        </div>
        <div class="modal-actions">
          <button id="btn-api-test" class="btn">測試連線</button>
          <button id="btn-api-save" class="btn btn-accent">儲存</button>
        </div>
        <div id="api-test-result" class="api-test-result"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="ai.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
