<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>緋夜飼育錄</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // 全域防閃退與錯誤攔截器
        window.onerror = function(msg, url, line) {
            console.error("運行異常: ", msg, " 行數: ", line);
            var errBox = document.getElementById("error-banner");
            if (errBox) {
                errBox.style.display = "block";
                errBox.innerText = "系統提示：捕捉到運行異常 (" + msg + ")";
            }
            return false;
        };
    </script>
</head>
<body>
    <div id="error-banner" class="error-banner" style="display: none;"></div>

    <div class="app-container">
        <!-- 頂部極簡狀態列 -->
        <header class="top-bar">
            <span class="app-title">緋夜飼育錄</span>
            <div class="top-info">
                <span id="display-time" class="time-tag">第 1 日 · 清晨</span>
                <span id="display-quick-gold" class="gold-tag">800 G</span>
            </div>
        </header>

        <!-- 主體內容區 (依分頁切換) -->
        <main class="content-body">
            <!-- 1. 劇情對話分頁 (選項為主 + 自由輸入) -->
            <section id="tab-story" class="tab-content active">
                <div id="story-log" class="story-scroll">
                    <!-- 劇情與對話動態插入 -->
                </div>
                <!-- 動態選項區塊 (主要推進方式) -->
                <div id="story-choices" class="choices-container">
                    <!-- 動態產生的情境選項 -->
                </div>
                <!-- 自由輸入框 (輔助細膩操作) -->
                <div class="input-container">
                    <textarea id="player-input" placeholder="或是自行輸入任何行動、言語或指令..." rows="2"></textarea>
                    <button id="btn-send" class="btn-action" onclick="handleSendAction()">行動</button>
                </div>
            </section>

            <!-- 2. 魅魔狀態分頁 -->
            <section id="tab-succubi" class="tab-content">
                <div id="succubi-container" class="card-list">
                    <!-- 魅魔卡片動態渲染 -->
                </div>
            </section>

            <!-- 3. 主控專屬檔案分頁 (風格切換 + 自訂人設 + API設定) -->
            <section id="tab-master" class="tab-content">
                <div class="master-panel">
                    <div class="panel-header">
                        <h2>主控檔案</h2>
                        <button class="btn-subtle" onclick="openApiModal()">⚙️ AI 模型設定</button>
                    </div>

                    <div class="game-card">
                        <div class="card-header">
                            <span id="master-title" class="card-title">見習飼育員 (Rank 1)</span>
                            <span id="master-hp-badge" class="card-badge mint">體力: 100/100</span>
                        </div>
                        <div class="exp-bar-box">
                            <div class="exp-text">
                                <span>階級經驗</span>
                                <span id="master-exp-text">0 / 120 EXP</span>
                            </div>
                            <div class="progress-track">
                                <div id="master-exp-bar" class="progress-fill" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                    <div class="game-card">
                        <label class="section-label">調教訓練風格：</label>
                        <select id="master-style-select" class="styled-select" onchange="handleStyleChange()">
                            <option value="dom">支配施虐型（冷酷嚴苛、崇尚威嚴、注重規矩與責罰）</option>
                            <option value="soft">溫柔調教型（循循善誘、注重安撫與依戀、先攻心後破防）</option>
                            <option value="profit">純粹利益型（理性冷血、視魅魔為高價值契約物）</option>
                            <option value="lust">情慾沉淪型（享受雙方極致肉體糾纏與反客為主的快感）</option>
                        </select>
                        <p class="hint-text">* 風格將直接改變 AI 生成劇情時你的言行風範與魅魔對你的敬畏態度。</p>
                    </div>

                    <div class="game-card">
                        <label class="section-label">主控自訂人設（背景/個性/外貌細節）：</label>
                        <textarea id="master-custom-persona" class="styled-textarea" rows="4" 
                            placeholder="例如：曾是帝國宮廷高階調教師，因遭陷害流落貧民窟。表面舉止溫雅有禮，實則眼光銳利、具有偏執的佔有慾..." 
                            onblur="handlePersonaBlur()"></textarea>
                        <p class="hint-text">* 此設定將作為不可推翻的事實注入 AI 大腦，深刻影響對話劇情。</p>
                    </div>
                </div>
            </section>

            <!-- 4. 背包道具分頁 (純展示品項/文案/數值變動) -->
            <section id="tab-items" class="tab-content">
                <div id="inventory-container" class="card-list">
                    <!-- 道具清單動態渲染 -->
                </div>
            </section>

            <!-- 5. 領地房產分頁 (三層折疊) -->
            <section id="tab-housing" class="tab-content">
                <div id="housing-container" class="district-list">
                    <!-- 街區房屋動態渲染 -->
                </div>
            </section>
        </main>

        <!-- 底部五大功能導航條 -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('tab-story')">
                <span class="nav-icon">📖</span>
                <span class="nav-text">劇情推進</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-succubi')">
                <span class="nav-icon">🥀</span>
                <span class="nav-text">魅魔狀態</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-master')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">主控檔案</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-items')">
                <span class="nav-icon">📦</span>
                <span class="nav-text">隨身背包</span>
            </button>
            <button class="nav-item" onclick="switchTab('tab-housing')">
                <span class="nav-icon">🗝️</span>
                <span class="nav-text">領地房產</span>
            </button>
        </nav>
    </div>

    <!-- API 設置彈出視窗 -->
    <div id="api-modal" class="modal-backdrop" style="display: none;">
        <div class="modal-box">
            <h3 style="margin-bottom: 12px; color: #775C56;">⚙️ AI 模型連線設置</h3>
            
            <label class="modal-label">API 密鑰 (API Key)：</label>
            <input type="password" id="cfg-api-key" class="modal-input" placeholder="sk-...">

            <label class="modal-label">API 伺服器端點 (URL)：</label>
            <input type="text" id="cfg-api-url" class="modal-input" placeholder="https://api.openai.com/v1/chat/completions">

            <label class="modal-label">模型識別碼 (Model)：</label>
            <input type="text" id="cfg-api-model" class="modal-input" placeholder="gpt-4o-mini">

            <div class="modal-actions">
                <button class="btn-subtle" onclick="closeApiModal()">取消</button>
                <button class="btn-action" onclick="saveApiSettings()">保存設置</button>
            </div>
        </div>
    </div>

    <!-- 核心腳本載入順序 -->
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="ai.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
